name: Build 25.12 PassWall

on:
  workflow_dispatch:

jobs:
  build_passwall_2512:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl wget

      - name: 赋予脚本执行权限
        run: chmod +x shell/pw25.sh

      - name: 执行打包脚本
        run: ./shell/pw25.sh --all

      #- name: 上传 Artifacts（每个架构的 APK）
        #uses: actions/upload-artifact@v7
        #with:
          #name: passwall-apks
          #path: dist/passwall-run/apks/
          #retention-days: 7

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: 上传 Release（仅 .run 文件）
        uses: softprops/action-gh-release@v3
        with:
          files: dist/passwall-run/run/*.run
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          draft: false
          overwrite_files: true
          body_path: info/info.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
